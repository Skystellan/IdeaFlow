<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>IdeaFlow</title><link rel="stylesheet" href="/welcome.css"><script defer src="/welcome.js"></script></head>
<body>
<main>
  <section class="intro">
    <div class="mark" aria-hidden="true">↗</div><p class="eyebrow">IDEAFLOW</p>
    <h1>让每一次实验，<br>成为下一步的起点。</h1>
    <p class="description">从一个问题出发，接上实验、证据与新发现。<br>把研究的每条支线留在同一张画布上。</p>
    <div class="flow" aria-label="Idea 到实验，到 Insight，再到下一步"><span>Idea</span><i>↓</i><span>实验与证据</span><i>↳</i><span>Insight → Next</span></div>
    <p class="local">本地保存 · 与 Codex 共用研究记录</p>
  </section>
  <section class="projects" aria-labelledby="projects-title">
    <p class="eyebrow">YOUR RESEARCH</p><h2 id="projects-title">继续探索</h2>
    <p class="hint">打开已有研究，或从一个新问题开始。</p>
    <button id="open" class="primary">打开研究项目 <span>⌘O</span></button>
    <button id="create">新建研究项目 <span>＋</span></button>
    <h3>最近项目</h3><div id="recent"><p class="hint">打开项目后，会在这里留下入口。</p></div>
    <p id="status" role="status"></p>
    <p class="footnote">研究记录随项目文件夹保存。App 打开后即可使用，无需启动终端。</p>
  </section>
</main>
</body></html>
